name: CI

on:
  # Nhánh khác main chỉ chạy qua pull_request, để một commit không bị kiểm hai lần.
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  bench-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci
      - run: npm run build
      # The benchmark starts its own PostgreSQL cluster with initdb/pg_ctl.
      # Chỉ file này cần PostgreSQL; phần còn lại của Vitest chạy ở unit-test.yml.
      - run: npx vitest run tests/bench-cache.test.js
        env:
          SIRIS_BENCH_PG_BIN: /usr/lib/postgresql/16/bin

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
